[package]
name = "pixiu-desk"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Pixiu 的个人只读后台：实盘状态、盈亏与 markout 分析、回测结果"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "deny"
todo = "deny"

[profile.release]
debug = 1
