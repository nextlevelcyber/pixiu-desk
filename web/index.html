<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixiu Desk</title>
<script>
/* 主题在首次渲染前设好（不闪）：选过「亮」或「暗」就设 data-theme，否则跟随系统。 */
try {
  const theme = localStorage.getItem("pixiu-desk-theme");
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
} catch (e) { /* 读不到存储：跟随系统 */ }
</script>
<!-- 由 pixiu-desk 托管：页面上的数字来自 desk 的 /api（存储里的运行）和 /api/prom（Prometheus 只读代理）。
     图表库随二进制内置，不走 CDN。界面布局沿用 Bedrock 做市后台。 -->
<script src="vendor/echarts.min.js"></script>
<style>
:root {
  --font: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --paper: #EDF0F3; --sheet: #FFFFFF; --ink: #17233B; --muted: #5D6A80; --slate: #8592A6;
  --rule: #D3DAE3; --grid: rgba(23,35,59,.05);
  --cobalt: #2F4FD6; --cobalt-wash: rgba(47,79,214,.08);
  --green: #0E8566; --red: #CF3B3B; --amber: #B9770E; --amber-wash: rgba(185,119,14,.13);
  --teal: #12827F; --violet: #7650C2; --nav: #17233B; --on-nav: #FFFFFF;
  --up: var(--green); --down: var(--red);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0E1624; --sheet: #131D2E; --ink: #E3E9F2; --muted: #8F9CB2; --slate: #7E8BA3;
    --rule: #26334A; --grid: rgba(227,233,242,.045); --cobalt: #7D93FF;
    --cobalt-wash: rgba(125,147,255,.12); --green: #39C38D; --red: #FF6E6E; --amber: #E3A43A;
    --amber-wash: rgba(227,164,58,.16); --teal: #3FB8B4; --violet: #A88BF0; --nav: #E3E9F2; --on-nav: #0E1624;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0E1624; --sheet: #131D2E; --ink: #E3E9F2; --muted: #8F9CB2; --slate: #7E8BA3;
  --rule: #26334A; --grid: rgba(227,233,242,.045); --cobalt: #7D93FF;
  --cobalt-wash: rgba(125,147,255,.12); --green: #39C38D; --red: #FF6E6E; --amber: #E3A43A;
  --amber-wash: rgba(227,164,58,.16); --teal: #3FB8B4; --violet: #A88BF0; --nav: #E3E9F2; --on-nav: #0E1624;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 13px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
.num, td, input { font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--cobalt); text-decoration: none; }
a:hover { text-decoration: underline; }

.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 24px; }
.brand { font-weight: 600; font-size: 14px; }
.brand small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.nav { display: flex; gap: 2px; }
.nav a { padding: 3px 12px; border-radius: 4px; color: var(--muted); }
.nav a:hover { text-decoration: none; color: var(--ink); }
.nav a[aria-current="page"] { background: var(--nav); color: var(--on-nav); }
.spacer { flex: 1; }
.theme { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.theme button { border: 0; border-right: 1px solid var(--rule); background: var(--sheet); color: var(--muted); padding: 1px 10px; font-size: 12px; cursor: pointer; }
.theme button:last-child { border-right: 0; }
.theme button[aria-pressed="true"] { background: var(--nav); color: var(--on-nav); }
.stat { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.stat b { font-weight: 600; margin-left: 4px; }
.stat.ok b { color: var(--teal); } .stat.warn b { color: var(--amber); } .stat.bad b { color: var(--red); }

main { padding: 16px 24px 48px; max-width: 1440px; margin: 0 auto; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; }
.section { margin-bottom: 14px; }
.sec-head { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px 6px; flex-wrap: wrap; }
.sec-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
.sub { color: var(--muted); font-size: 12px; }
.err { color: var(--red); }
.up { color: var(--up); } .down { color: var(--down); }
.banner { margin: 0 0 12px; padding: 8px 14px; border: 1px solid var(--amber); background: var(--amber-wash); border-radius: 4px; overflow-wrap: anywhere; }
.banner.bad { border-color: var(--red); }
.empty { padding: 18px 16px; color: var(--muted); }
.chip { display: inline-block; padding: 0 8px; border-radius: 3px; font-size: 12px; line-height: 20px; white-space: nowrap; margin-right: 4px; background: var(--grid); color: var(--muted); outline: 1px solid var(--rule); }
.chip.live { background: var(--cobalt-wash); color: var(--cobalt); outline: 0; }
.chip.backtest { background: var(--amber-wash); color: var(--amber); outline: 0; }
.chip.firing { background: var(--red); color: #fff; outline: 0; }
.chip.ok { color: var(--teal); }
.chip.warn { background: var(--amber-wash); color: var(--amber); outline: 0; }
td.grp { color: var(--ink); font-weight: 600; padding-top: 12px; border-bottom: 1px solid var(--rule); }

table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-weight: 400; color: var(--muted); font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td.r, th.r { text-align: right; }
td.wrap { white-space: normal; }
tr.item { cursor: pointer; }
tr.item:hover td { background: var(--cobalt-wash); }
.scroll { overflow-x: auto; }

.kpis { display: flex; flex-wrap: wrap; gap: 6px 26px; padding: 4px 16px 12px; align-items: baseline; }
.kpi .lbl { color: var(--muted); margin-right: 6px; }
.kpi b { font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi.big b { font-size: 20px; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 16px 8px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--rule); background: var(--sheet); padding: 2px 10px; font-size: 12px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--nav); color: var(--on-nav); }
.btn { border: 1px solid var(--rule); background: var(--sheet); padding: 3px 12px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .38; cursor: default; }
.chart { height: 300px; }
.chart.tall { height: 380px; }
.chart.short { height: 200px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.grid2 > div { min-width: 0; border-right: 1px solid var(--grid); }
.grid2 > div:last-child { border-right: 0; }
.note { padding: 6px 16px 12px; color: var(--muted); font-size: 12px; }
.term { border-bottom: 1px dotted var(--slate); cursor: help; }
pre.json { margin: 0; padding: 10px 16px 14px; font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); max-height: 420px; overflow: auto; }
details > summary { cursor: pointer; padding: 10px 16px; color: var(--muted); }

@media (max-width: 900px) {
  .top, main { padding-left: 16px; padding-right: 16px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .grid2 > div { border-right: 0; }
  .chart { height: 260px; }
}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<script src="app.js"></script>
</body>
</html>
